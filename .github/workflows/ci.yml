name: CI

on:
  push:
    branches:
    - 'main'
  pull_request:

env:
  go-version: '1.26'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: ${{ env.go-version }}
    - run: make go-deps
    - run: make mock
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
    - run: make test
